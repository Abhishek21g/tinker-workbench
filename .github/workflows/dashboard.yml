name: Dashboard export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[local]"

      - name: Generate demo runs and export dashboard
        run: |
          tinker-workbench run configs/memorization_sft.yaml --quiet
          tinker-workbench run configs/memorization_local.yaml --quiet
          tinker-workbench probe latest --json > probe.json
          python -c "import json; d=json.load(open('probe.json')); assert d.get('sampler_ready'), d"
          tinker-workbench export-dashboard latest --out site/data/dashboard.json

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/dashboard.json
          if git diff --cached --quiet; then
            echo "No dashboard changes"
            exit 0
          fi
          git commit -m "chore: refresh dashboard.json from CI"
          git push
