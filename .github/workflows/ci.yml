name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[local]" pytest ruff pyyaml
      - name: Lint
        run: ruff check tinker_workbench/ tests/
      - name: Test
        run: pytest tests/ -q
      - name: Smoke test the CLI
        run: |
          tinker-workbench plan configs/memorization_sft.yaml
          tinker-workbench run configs/memorization_sft.yaml --quiet
          tinker-workbench doctor latest
          tinker-workbench probe latest --json > probe.json
          python -c "import json; d=json.load(open('probe.json')); assert d.get('sampler_ready'), d"
          tinker-workbench report latest
          tinker-workbench export-dashboard latest --out site/data/dashboard.json
          # Real local neural-LM training, end to end
          tinker-workbench run configs/memorization_local.yaml --quiet
          tinker-workbench baseline latest --name local-ref
          tinker-workbench run configs/memorization_local.yaml --quiet
          tinker-workbench drift latest --baseline local-ref
