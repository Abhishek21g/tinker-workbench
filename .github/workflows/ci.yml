name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff pyyaml
      - name: Lint
        run: ruff check tinker_workbench/ tests/
      - name: Test
        run: pytest tests/ -q
      - name: Smoke test the CLI
        run: |
          tinker-workbench plan configs/memorization_sft.yaml
          tinker-workbench run configs/memorization_sft.yaml --quiet
          tinker-workbench doctor latest
          tinker-workbench report latest
