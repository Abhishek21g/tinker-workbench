# Demo config: training that diverges partway through.
# Run it, then `tinker-workbench doctor latest` to see the diagnosis.
name: failure-divergence
description: Simulated LR-too-high divergence for exercising the doctor.
mode: mock
training:
  method: sft
  steps: 30
  batch_size: 8
  learning_rate: 0.0001
  seed: 3
data:
  source: builtin:memorization
  train_examples: 64
  eval_examples: 32
  latent_bits: 10
checkpoints:
  every_steps: 10
evals:
  - name: exact_match
    grader: exact_match
    num_examples: 16
    max_sample_tokens: 16
mock:
  inject:
    diverge_at_step: 15
