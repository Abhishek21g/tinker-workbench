name: memorization-mock
description: Mock run for the Tinker project-ideas memorization empirical study.
mode: mock
model:
  provider: tinker
  base_model: meta-llama/Llama-3.2-1B
  adapter: lora
  lora_rank: 32
study:
  type: memorization
  latent_bits: 10
  train_examples: 128
  eval_examples: 64
  methods:
    - sft
    - rl_terminal_reward
    - rl_dense_reward
budget:
  train_tokens: 250000
  sample_tokens: 50000
  checkpoints: 4
  checkpoint_gb_each: 0.5
evals:
  - exact_match
  - bits_recovered

