[project]
name = "tinker-workbench"
version = "0.2.0"
description = "Plan, run, observe, debug, and evaluate Tinker post-training experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
tinker = ["tinker"]

[project.scripts]
tinker-workbench = "tinker_workbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
