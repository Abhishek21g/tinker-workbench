<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tinker Workbench — DX Dashboard</title>
    <meta
      name="description"
      content="Operational dashboard for Tinker post-training: platform uptime, run health, budget, and checkpoint trust."
    />
    <meta property="og:title" content="Tinker Workbench" />
    <meta
      property="og:description"
      content="Is Tinker up? Is my run healthy? Can I afford the next step? Can I trust this checkpoint?"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div class="ink-blob-wrap" aria-hidden="true">
      <svg class="ink-blob" viewBox="0 0 1100 1100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="g" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2da44e" stop-opacity="0.07" />
            <stop offset="100%" stop-color="#2da44e" stop-opacity="0" />
          </radialGradient>
        </defs>
        <circle cx="550" cy="550" r="520" fill="url(#g)" />
      </svg>
    </div>
    <div class="page-wrap">
      <div class="container">
        <div id="app" class="loading">Loading run data…</div>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
